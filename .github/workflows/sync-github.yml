name: Sync CHI-CityTech repos to DB

on:
  schedule:
    - cron: '30 5 * * *'        # 05:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Rebuild DB (schema + seeds + GitHub schema)
        run: python3 scripts/build_db.py

      - name: Pull repos from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-injected; raises rate limit
          BBS_GITHUB_ORG: CHI-CityTech
        run: python3 scripts/sync_github.py

      - name: Rebuild static site
        run: python3 site/build_site.py

      - name: Commit DB + site changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balanced_blended_space.db site/dist/ || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: sync CHI-CityTech repos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "(no changes)"
          fi
